services:
  postgres:
    image: postgres:16-alpine
    container_name: tech-forum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tech_forum
      POSTGRES_USER: tech_forum
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - tech_forum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tech_forum -d tech_forum"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tech_forum_pgdata:
